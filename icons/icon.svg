<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner circle glow -->
  <circle cx="256" cy="256" r="185" fill="url(#pawGrad)" filter="url(#shadow)" />

  <!-- Modern Paw Icon in pure crisp white -->
  <g fill="#ffffff">
    <!-- Main pad -->
    <path d="M 256 265 C 220 265 190 295 190 335 C 190 365 215 390 256 390 C 297 390 322 365 322 335 C 322 295 292 265 256 265 Z" />
    <!-- Top-left toe -->
    <ellipse cx="215" cy="235" rx="28" ry="36" transform="rotate(-15 215 235)" />
    <!-- Top-right toe -->
    <ellipse cx="297" cy="235" rx="28" ry="36" transform="rotate(15 297 235)" />
    <!-- Far-left toe -->
    <ellipse cx="160" cy="285" rx="24" ry="32" transform="rotate(-40 160 285)" />
    <!-- Far-right toe -->
    <ellipse cx="352" cy="285" rx="24" ry="32" transform="rotate(40 352 285)" />
  </g>

  <!-- SmartPet text accent at bottom -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#2dd4bf" text-anchor="middle" letter-spacing="2">SMARTPET</text>
</svg>
